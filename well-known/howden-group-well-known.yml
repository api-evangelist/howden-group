source: live probes of Howden Group web hosts, 2026-07-25
note: >-
  Howden Group publishes no API host, so the /.well-known/ surface was probed
  against the corporate marketing hosts, the client login wall
  (parentportal.howdengroup.com), the HowdenCAP Tepfin X placement application
  (tepfinx.com) and the sibling DUAL / Howden Re brands. Two real documents
  exist: an RFC 9116 security.txt on www.howdengroup.com (mirrored on
  www.howdenre.com with the same canonical) and a robots.txt carrying an AI
  preference Content-Signal directive. No OAuth/OIDC discovery, no API catalog
  and no ai-plugin manifest is served anywhere. Hosts marked soft_404 return
  HTTP 200 with content-type text/html and a SPA/CMS shell body, not a document.
