    harvested: 0
    note: |
      Probed /openapi.json, /openapi.yaml, /swagger.json, /swagger/v1/swagger.json,
      /api-docs and /spec against howdengroup.com, parentportal.howdengroup.com
      and tepfinx.com. Every response that returned HTTP 200 served
      content-type text/html beginning with <!DOCTYPE html> — soft-404 shell
      pages, not specifications. Zero OpenAPI or Swagger documents exist to
      harvest. No openapi/ directory was created.
  acordPosture:
    phrase: ACORD GRLC digital accounting and invoicing standards live via ACORD
      Solutions Group ADEPT gateway (XML + JSON), with Hiscox
    confirmed: true
    detail: |
      This is the strongest ACORD signal in the UK broker tier and it is real,
      not marketing. On 3 July 2025 ACORD and Howden announced that ACORD
      Standards for digital accounting and invoicing are live and operational
      in the UK retail insurance market — the first use of ACORD digital
      accounting standards in the UK outside the specialty and (re)insurance
      market. Howden operationalised the ACORD GRLC (Global Reinsurance & Large
      Commercial) Standards for digital invoicing using ACORD Solutions Group's
      ADEPT (ACORD Data Exchange Platform & Translator) as a messaging gateway
      and portal, with retail insurer partner Hiscox responding to Howden's
      digital invoices in real time through the ADEPT receiver portal. ADEPT is
      cloud-native, supports both XML and JSON messaging, and connects
      stakeholders over API architecture. Separately, ACORD has mapped its
      messaging standards to Lloyd's API Factory placement specifications, the
      London-market rail Howden's specialty business sits on.
      No AL3 usage was found (AL3 is a US personal/commercial-lines agency
      download format; Howden's UK and specialty footprint uses ACORD XML/GRLC
      instead). No IVANS, Applied Epic or Vertafore AMS360 integration was
      found on Howden's own properties.
  insuranceVerbs:
    quote:
      exposed: partner-only
      note: HowdenCAP Tepfin X submits and triages structured credit
        submissions to carrier underwriting platforms over bilateral APIs.
    bind:
      exposed: partner-only
      note: Announcements describe "presentation, negotiation, binding and
        management of credit insurance contracts through APIs" with Allianz
        Trade, AXA XL and Mosaic. No public documentation.
    issue:
      exposed: partner-only
      note: Policy/contract management follows binding inside the same
        bilateral partner integrations. Accounting and invoicing runs on ACORD
        GRLC over ADEPT with Hiscox.
    fnol:
      exposed: false
      note: No claims or FNOL API surface found, public or announced.
    audience: partner-only (broker-to-carrier); no consumer-facing or
      agent-self-serve API exists
  authModel:
    scheme: not publicly documented
    note: |
      No public auth documentation exists because no public API exists. The
      observable surfaces are browser login walls — parentportal.howdengroup.com
      and tepfinx.com both serve interactive sign-in applications. No OIDC or
      OAuth authorization-server metadata is served at
      /.well-known/openid-configuration or /.well-known/oauth-authorization-server
      on any Howden host probed. Partner API credentials for the Tepfin X and
      ADEPT integrations are issued under bilateral contract.
  webhooks:
    exists: false
