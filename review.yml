  githubOrganization:
    note: Two GitHub organizations exist with matching names — HowdenGroup
      (created 2017, location UK) and howden-group (created 2019) — but both
      report 0 public repositories and neither carries a description, blog URL
      or any artifact tying it to the insurance broker rather than the
      unrelated Howden engineering business. Not cited as a property.
  transports:
  - protocol: REST
    scheme: https
    documented: false
    note: Bilateral partner APIs between Tepfin X and carrier underwriting
      platforms are described in announcements but never documented publicly.
      No base URL is published.
  - protocol: ACORD messaging (XML and JSON over ADEPT)
    scheme: https
    documented: false
    note: ACORD GRLC digital accounting and invoicing messages exchanged with
      Hiscox through ACORD Solutions Group's ADEPT gateway. Standard is public
      via ACORD; Howden's endpoints are not.
  - protocol: GraphQL
    documented: false
    note: None found.
  - protocol: WebSocket
    scheme: wss
    documented: false
    note: None found.
