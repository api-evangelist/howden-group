actions:
  openapiHarvested: false
  specsSaved: 0
  apisYmlEntries: 0
  reason: |
    apis[] is intentionally EMPTY. Howden Group operates real broker-to-carrier
    APIs and a live ACORD GRLC/ADEPT accounting integration, but none of it is
    publicly documented, none of it has a published base URL, and no OpenAPI,
    Swagger, AsyncAPI, Postman, GraphQL or .proto artifact exists to harvest.
    Listing an announcement page as an API reference would fabricate a surface
    that does not exist. The honest record is: partner-gated, no public API.
