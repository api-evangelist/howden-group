aid: howden-group
name: Howden Group
review:
  question: Does Howden Group expose a real, self-serve public developer portal or
    any downloadable API definitions?
  answer: false
  date: '2026-07-25'
  reviewer: API Evangelist
  homeMarket: United Kingdom
  tier: broker-intermediary
  gated: true
findings:
  summary: |
    Howden Group Holdings publishes NO public, self-serve developer portal and
    NO downloadable API definition of any kind. Every conventional developer
    host was probed on 2026-07-25 and none resolves: developer.howdengroup.com,
    developers.howdengroup.com, docs.howdengroup.com and api.howdengroup.com
    all fail DNS resolution (curl exit code 6, HTTP 000). Every conventional
    developer path on the corporate site returns HTTP 404:
    /developers, /api, /developer, /partners, /integrations.

    The only authenticated surfaces found are login walls, not developer
    portals. parentportal.howdengroup.com returns HTTP 200 with the bare title
    "Howden Insurance Portal" — a client/broker sign-in application with no
    reference documentation. tepfinx.com returns HTTP 200 as a JavaScript
    application shell titled "Tepfin-X" (HowdenCAP's structured credit
    placement platform) with no docs, no sign-up, and no API reference in the
    served HTML. Under the sibling DUAL brand, developer.dualinsurance.com and
    api.dualinsurance.com both resolve and return HTTP 200 but serve the cPanel
    /cgi-sys/defaultwebpage.cgi placeholder — parked hostnames, not portals.

    Howden's real integration work is genuine but bilateral and invisible from
    the outside. HowdenCAP markets itself as "the only broker in the London
    structured credit insurance market to have direct APIs with insurers,"
    connecting Tepfin X to carrier underwriting platforms one partner at a time
    (Allianz Trade, October 2022; AXA XL; Mosaic Insurance). Those APIs carry
    "presentation, negotiation, binding and management of credit insurance
    contracts" but are contracted partner integrations with no public
    documentation, no endpoints, and no specification published anywhere.

    Howden also sits inside the London market's modernization programme —
    Howden (RKH Specialty) participated in Lloyd's closed Beta Group refining
    the Core Data Record under Blueprint Two, and Howden partnered with
    Whitespace for digital placement — but Blueprint Two, PPL and Whitespace
    are market infrastructure aimed at brokers and syndicates, not at
    developers, so none of it produces a public Howden API surface.

    This is a correct and expected outcome for a UK broker-intermediary. The
    UK has an FCA and a PRA but no open-insurance obligation; the FCA's Open
    Finance work remains consultation, not rule. Recording the absence
    accurately is the finding.
