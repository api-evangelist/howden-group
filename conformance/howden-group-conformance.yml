note: >-
  Howden Group publishes no public API and no machine-readable API contract, so
  none of the API-shaped standards below can be asserted. What Howden does
  conform to is real but sits at the messaging and market-infrastructure layer:
  ACORD GRLC digital accounting and invoicing standards, live in production over
  ACORD Solutions Group's ADEPT gateway with retail insurer partner Hiscox since
  July 2025, plus web-layer standards (RFC 9116 security.txt, SPF, DMARC,
  Content-Signal). Every "conforms: false" below is an observed absence, not an
  assumption.
standards:
- id: acord-grlc
  name: ACORD GRLC (Global Reinsurance & Large Commercial) Standards
  conforms: true
  scope: digital accounting and invoicing messaging
  evidence: >-
    ACORD announcement 3 July 2025 — ACORD Standards for digital accounting and
    invoicing live and operational with Howden in the UK retail insurance
    market; first use of ACORD digital accounting standards in the UK outside
    the specialty and (re)insurance market.
  source: https://www.acord.org/ACORD-about/acord-news/2025/07/03/acord-and-howden-pioneer-the-adoption-of-digital-invoicing-standards-in-the-uk-retail-insurance-market
- id: acord-adept
  name: ACORD Solutions Group ADEPT (ACORD Data Exchange Platform & Translator)
  conforms: true
  scope: messaging gateway and receiver portal
  evidence: >-
    Howden operationalised ACORD GRLC digital invoicing over ADEPT, with Hiscox
    responding to Howden's digital invoices in real time through the ADEPT
    receiver portal. ADEPT is cloud-native and supports both XML and JSON
    messaging over API architecture. Howden does not publish its ADEPT endpoints.
  source: https://www.reinsurancene.ws/acord-and-howden-partner-to-enhance-digital-accounting-and-invoicing-standards/
- id: acord-al3
  name: ACORD AL3
  conforms: false
  evidence: >-
    No AL3 usage found. AL3 is a US personal/commercial-lines agency download
    format; Howden's UK and specialty footprint uses ACORD XML/GRLC instead.
